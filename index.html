<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>環境知識挑戰擂台賽 - 線上測驗系統</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --secondary-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --correct-color: #2e7d32;
            --incorrect-color: #c62828;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: #f0f4f1;
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 30px;
            position: relative;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* 讀取狀態 */
        .loading-container {
            text-align: center;
            padding: 40px 0;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: var(--incorrect-color);
            background: #ffebee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
        }

        /* Setup Screen */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.99);
        }

        /* Quiz Screen */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #666;
            background: #e8f5e9;
            padding: 10px 15px;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: var(--primary-color);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 5px;
        }

        .badge-cat {
            background: #1976d2;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #222;
        }

        .options-list {
            list-style: none;
            margin-bottom: 25px;
        }

        .option-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            font-size: 1rem;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background-color: #f1f8e9;
        }

        .option-item.selected {
            border-color: var(--primary-color);
            background-color: #e8f5e9;
            font-weight: bold;
        }

        .option-prefix {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .option-item.selected .option-prefix {
            background: var(--primary-color);
            color: white;
        }

        /* Result Screen */
        .score-card {
            text-align: center;
            padding: 25px;
            background: #e8f5e9;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
        }

        .score-number {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--primary-color);
            line-height: 1;
            margin: 10px 0;
        }

        .score-meta {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 0.95rem;
            color: #555;
        }

        .review-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .review-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .review-item.correct {
            border-left: 5px solid var(--correct-color);
        }

        .review-item.incorrect {
            border-left: 5px solid var(--incorrect-color);
        }

        .review-q {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .review-ans {
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .text-correct { color: var(--correct-color); font-weight: bold; }
        .text-incorrect { color: var(--incorrect-color); font-weight: bold; }

        .explanation {
            font-size: 0.88rem;
            color: #555;
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            border: 1px dashed #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌱 環境知識挑戰擂台賽</h1>
        <p>線上模擬測驗系統（滿分 100 分）</p>
    </header>

    <div id="error-box" class="error-message"></div>

    <!-- 0. 題庫載入中畫面 -->
    <div id="loading-screen" class="loading-container">
        <div class="spinner"></div>
        <p>正在載入題庫資料中，請稍候...</p>
    </div>

    <!-- 1. 設定畫面 -->
    <div id="setup-screen" class="screen">
        <div class="form-group">
            <label for="level-select">選擇題目級別：</label>
            <select id="level-select" class="form-control">
                <option value="全部">全部級別（綜合）</option>
                <option value="初級">初級</option>
                <option value="中級">中級</option>
                <option value="中高級">中高級</option>
                <option value="高級">高級</option>
            </select>
        </div>

        <div class="form-group">
            <label for="category-select">選擇主題分類：</label>
            <select id="category-select" class="form-control">
                <option value="全部">全主題（綜合）</option>
                <!-- 動態由 JavaScript 載入所有分類標籤 -->
            </select>
        </div>

        <div class="form-group">
            <label for="count-select">選擇測驗題數：</label>
            <select id="count-select" class="form-control">
                <option value="5">5 題（每題 20 分）</option>
                <option value="10" selected>10 題（每題 10 分）</option>
                <option value="20">20 題（每題 5 分）</option>
                <option value="25">25 題（每題 4 分）</option>
                <option value="50">50 題（每題 2 分）</option>
            </select>
        </div>

        <button class="btn" id="start-btn" onclick="startQuiz()" disabled>題庫載入中...</button>
    </div>

    <!-- 2. 測驗進行畫面 -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-header">
            <div>
                <span class="badge" id="current-level-badge">級別</span>
                <span class="badge-cat" id="current-category-badge">分類</span>
                <span id="question-count-text">第 1 / 10 題</span>
            </div>
            <div>配分：每題 <span id="points-per-q">10</span> 分</div>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress-bar"></div>
        </div>

        <div class="question-title" id="question-text">題目載入中...</div>

        <ul class="options-list" id="options-container"></ul>

        <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>下一題</button>
    </div>

    <!-- 3. 結算成績畫面 -->
    <div id="result-screen" class="screen">
        <div class="score-card">
            <h2>測驗完成！</h2>
            <div class="score-number" id="final-score">0</div>
            <p>總分：100 分</p>
            <div class="score-meta">
                <span>答對：<strong id="correct-count" class="text-correct">0</strong> 題</span>
                <span>答錯：<strong id="incorrect-count" class="text-incorrect">0</strong> 題</span>
                <span>正確率：<strong id="accuracy-rate">0%</strong></span>
            </div>
        </div>

        <h3 style="margin-bottom: 12px; color: #444;">答題檢討與解析</h3>
        <div class="review-list" id="review-container"></div>

        <button class="btn" onclick="resetQuiz()">再測驗一次</button>
    </div>
</div>

<script>
let ALL_QUESTIONS = [];
let currentQuiz = [];
let currentIndex = 0;
let userAnswers = [];
let pointsPerQuestion = 0;

// 當網頁載入時，發送 fetch 請求讀取同目錄下的 questions.json
window.addEventListener('DOMContentLoaded', () => {
    fetch('questions.json')
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            ALL_QUESTIONS = data;
            
            // 動態初始化分類標籤選項
            initCategories(data);

            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('setup-screen').classList.add('active');
            
            const startBtn = document.getElementById('start-btn');
            startBtn.disabled = false;
            startBtn.innerText = '開始測驗';
        })
        .catch(error => {
            console.error('題庫載入失敗:', error);
            document.getElementById('loading-screen').style.display = 'none';
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'block';
            errorBox.innerHTML = `⚠️ 題庫 (questions.json) 載入失敗！<br><small>詳細原因：${error.message}<br>提示：若在電腦本機開啟，請確認是否透過 GitHub Pages 或 HTTP 伺服器開啟。</small>`;
        });
});

function initCategories(data) {
    const categorySelect = document.getElementById('category-select');
    const categories = new Set();
    
    data.forEach(q => {
        if (q.category) {
            categories.add(q.category);
        }
    });

    const sortedCategories = Array.from(categories).sort();
    sortedCategories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
    });
}

function startQuiz() {
    const selectedLevel = document.getElementById('level-select').value;
    const selectedCategory = document.getElementById('category-select').value;
    const selectedCount = parseInt(document.getElementById('count-select').value);

    // 同時篩選級別與分類標籤
    let filtered = ALL_QUESTIONS.filter(q => {
        const matchLevel = (selectedLevel === '全部' || q.level === selectedLevel);
        const matchCategory = (selectedCategory === '全部' || q.category === selectedCategory);
        return matchLevel && matchCategory;
    });

    if (filtered.length === 0) {
        alert("找不到符合該「級別」與「分類」條件的題目，請重新選擇條件！");
        return;
    }

    // 隨機抽題
    let shuffled = [...filtered].sort(() => 0.5 - Math.random());
    currentQuiz = shuffled.slice(0, Math.min(selectedCount, shuffled.length));
    
    currentIndex = 0;
    userAnswers = new Array(currentQuiz.length).fill(null);
    pointsPerQuestion = 100 / currentQuiz.length;

    // UI 切換
    document.getElementById('setup-screen').classList.remove('active');
    document.getElementById('quiz-screen').classList.add('active');
    document.getElementById('result-screen').classList.remove('active');

    document.getElementById('points-per-q').innerText = pointsPerQuestion % 1 === 0 ? pointsPerQuestion : pointsPerQuestion.toFixed(1);

    renderQuestion();
}

function renderQuestion() {
    const q = currentQuiz[currentIndex];
    const total = currentQuiz.length;

    document.getElementById('current-level-badge').innerText = q.level || '無級別';
    document.getElementById('current-category-badge').innerText = q.category || '未分類';

    document.getElementById('question-count-text').innerText = `第 ${currentIndex + 1} / ${total} 題`;
    document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / total) * 100}%`;
    document.getElementById('question-text').innerText = `${currentIndex + 1}. ${q.question}`;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const prefixes = ['1', '2', '3', '4'];
    q.options.forEach((opt, idx) => {
        const optionNum = idx + 1;
        const li = document.createElement('li');
        li.className = 'option-item' + (userAnswers[currentIndex] === optionNum ? ' selected' : '');
        li.onclick = () => selectOption(optionNum);

        li.innerHTML = `
            <div class="option-prefix">${prefixes[idx]}</div>
            <div>${opt}</div>
        `;
        optionsContainer.appendChild(li);
    });

    const nextBtn = document.getElementById('next-btn');
    nextBtn.disabled = userAnswers[currentIndex] === null;
    nextBtn.innerText = currentIndex === total - 1 ? '提交試卷' : '下一題';
}

function selectOption(optionNum) {
    userAnswers[currentIndex] = optionNum;
    renderQuestion();
}

function nextQuestion() {
    if (currentIndex < currentQuiz.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    let score = 0;
    let correctCount = 0;

    currentQuiz.forEach((q, idx) => {
        if (userAnswers[idx] === q.answer) {
            score += pointsPerQuestion;
            correctCount++;
        }
    });

    score = Math.round(score);

    const total = currentQuiz.length;
    const incorrectCount = total - correctCount;
    const accuracy = Math.round((correctCount / total) * 100);

    document.getElementById('final-score').innerText = score;
    document.getElementById('correct-count').innerText = correctCount;
    document.getElementById('incorrect-count').innerText = incorrectCount;
    document.getElementById('accuracy-rate').innerText = `${accuracy}%`;

    const reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';

    currentQuiz.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        const isCorrect = userAns === q.answer;

        const item = document.createElement('div');
        item.className = `review-item ${isCorrect ? 'correct' : 'incorrect'}`;

        let userAnsText = userAns ? `${userAns}. ${q.options[userAns - 1]}` : '未作答';
        let correctAnsText = `${q.answer}. ${q.options[q.answer - 1]}`;

        item.innerHTML = `
            <div class="review-q">${idx + 1}. [${q.level}][${q.category || '未分類'}] ${q.question}</div>
            <div class="review-ans">您的答案：<span class="${isCorrect ? 'text-correct' : 'text-incorrect'}">${userAnsText}</span></div>
            ${!isCorrect ? `<div class="review-ans">正確答案：<span class="text-correct">${correctAnsText}</span></div>` : ''}
            ${q.explanation ? `<div class="explanation">💡 <strong>題目解析：</strong>${q.explanation}</div>` : ''}
        `;
        reviewContainer.appendChild(item);
    });

    document.getElementById('quiz-screen').classList.remove('active');
    document.getElementById('result-screen').classList.add('active');
}

function resetQuiz() {
    document.getElementById('result-screen').classList.remove('active');
    document.getElementById('setup-screen').classList.add('active');
}
</script>

</body>
</html>
